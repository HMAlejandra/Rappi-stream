# ===================================================
# application.properties — order_processor
# Puerto: 8081
# ===================================================

server.port=8081
spring.application.name=order-processor

# --- RabbitMQ ---
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:rappi_admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:rappi_rmq_2024}

# --- Kafka ---
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# --- PostgreSQL / JPA ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rappi_stream_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rappi_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rappi_pass_2024}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- Jackson: Instant como ISO-8601 ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Logging ---
logging.level.com.rappistream=INFO
logging.level.org.springframework.amqp=WARN
logging.level.org.apache.kafka=WARN
logging.level.org.hibernate.SQL=WARN
