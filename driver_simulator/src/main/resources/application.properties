# ===================================================
# application.properties — driver_simulator
# Puerto: 8082
# ===================================================

server.port=8082
spring.application.name=driver-simulator

# --- Kafka ---
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# --- Jackson: serializar Instant como ISO-8601 (no timestamps numéricos) ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Tiempos de simulación (ms) ---
# Ajustables sin recompilar. Valores por defecto para desarrollo local.
simulator.delay.delivery-started-ms=5000
simulator.delay.driver-arriving-ms=8000
simulator.delay.order-delivered-ms=5000

# --- Logging ---
logging.level.com.rappistream=INFO
logging.level.org.apache.kafka=WARN
