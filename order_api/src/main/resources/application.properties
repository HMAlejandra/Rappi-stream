# ===================================================
# application.properties — order_api
# Puerto: 8080
# ===================================================

server.port=8080
spring.application.name=order-api

# --- RabbitMQ ---
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:rappi_admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:rappi_rmq_2024}

# --- Jackson: Instant como ISO-8601 ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Validación: mensajes de error detallados ---
server.error.include-message=always
server.error.include-binding-errors=always

# --- Logging ---
logging.level.com.rappistream=INFO
logging.level.org.springframework.amqp=WARN
