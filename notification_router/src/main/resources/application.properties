# ===================================================
# application.properties — notification_router
# Puerto: 8083
# ===================================================

server.port=8083
spring.application.name=notification-router

# --- Kafka ---
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# --- RabbitMQ ---
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:rappi_admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:rappi_rmq_2024}

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Logging ---
logging.level.com.rappistream=INFO
logging.level.org.springframework.amqp=WARN
logging.level.org.apache.kafka=WARN
