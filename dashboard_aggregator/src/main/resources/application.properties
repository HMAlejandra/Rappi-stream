# ===================================================
# application.properties — dashboard_aggregator
# Puerto: 8086
# ===================================================

server.port=8086
spring.application.name=dashboard-aggregator

# --- Kafka ---
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# --- PostgreSQL / JPA ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rappi_stream_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rappi_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rappi_pass_2024}
spring.datasource.driver-class-name=org.postgresql.Driver

# validate: Hibernate verifica que las entidades coincidan con las tablas
# (creadas por init.sql). No modifica el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- URL del dashboard_backend ---
# En Docker Compose usa el nombre del servicio; en local usa localhost
dashboard.backend.url=${DASHBOARD_BACKEND_URL:http://localhost:8087}

# --- Logging ---
logging.level.com.rappistream=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.hibernate.SQL=WARN
