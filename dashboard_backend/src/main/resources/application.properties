# ===================================================
# application.properties — dashboard_backend
# Puerto: 8087
# ===================================================

server.port=8087
spring.application.name=dashboard-backend

# Tomcat 10 valida estrictamente los hostnames (RFC 952/1123).
# El guion bajo '_' en 'dashboard_backend' (nombre del servicio Docker)
# hace que Tomcat devuelva 400 al recibir el header Host con ese nombre.
# Esta propiedad deshabilita esa validación para entornos de desarrollo.
server.tomcat.relaxed-path-chars=|,{,},[,],%,~
server.tomcat.relaxed-query-chars=|,{,},[,]
# Deshabilita completamente la validación del header Host en desarrollo
server.tomcat.reject-illegal-header=false

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Logging ---
logging.level.com.rappistream=INFO
logging.level.org.springframework.web.socket=WARN
