# ===================================================
# application.properties — dashboard_backend
# Puerto: 8087
# ===================================================

server.port=8087
spring.application.name=dashboard-backend

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Logging ---
logging.level.com.rappistream=INFO
logging.level.org.springframework.web.socket=WARN

# --- Proxy hacia order_api ---
order.api.url=${ORDER_API_URL:http://orderapi:8080}

# --- URL del dashboard_aggregator (para hidratación del estado inicial) ---
# Alias sin guion bajo para evitar error Tomcat (guion bajo invalido en Host header RFC)
aggregator.url=${AGGREGATOR_URL:http://dashboardaggregator:8086}
