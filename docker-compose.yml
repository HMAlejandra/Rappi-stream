# Rappi-Stream — docker-compose.yml
# Uso: docker compose up -d | docker compose ps | docker compose logs <svc>
#
# ── Topología de red ──────────────────────────────────────────────────
#   rappi_public_net   → servicios de entrada expuestos al host (order_api, dashboard-backend)
#   rappi_internal_net  → infraestructura + servicios internos que consumen Kafka/RabbitMQ/Postgres
#   Un servicio puede pertenecer a ambas redes cuando expone puerto al host y a la vez
#   necesita reachar la infraestructura interna (p.ej. order_api → rabbitmq).

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.2-alpine
    container_name: rappi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - rappi_internal_net

  # ── RabbitMQ — panel: http://localhost:15672 ──────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rappi_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - rappi_internal_net

  # ── Kafka 7.6 — modo KRaft (sin ZooKeeper) ───────────────────────────
  # KAFKA_CLUSTER_ID: UUID base64 de 22 chars — fijo en .env para arranques deterministas.
  # deploy.resources.limits aplica cuotas de CPU/RAM via cgroups del kernel.
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: rappi_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
    networks:
      - rappi_internal_net

  # ── Init container — crea topic order_events (3 particiones) ─────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: rappi_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"
    networks:
      - rappi_internal_net

  # ── order_api — puerto 8080 (entrada pública) ────────────────────────
  # Expuesto al host (rappi_public_net) y conectado a la red interna para
  # reachar RabbitMQ (publica comandos en la cola de órdenes).
  order_api:
    build:
      context: .
      dockerfile: infrastructure/docker/order_api.Dockerfile
    container_name: rappi_order_api
    restart: unless-stopped
    ports:
      - "${ORDER_API_PORT:-8080}:8080"
    environment:
      SPRING_RABBITMQ_HOST:     rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/orders/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      rappi_public_net:
      rappi_internal_net:
        aliases:
          - orderapi

  # ── order_processor — puerto 8081 (interno) ──────────────────────────
  order_processor:
    build:
      context: .
      dockerfile: infrastructure/docker/order_processor.Dockerfile
    container_name: rappi_order_processor
    restart: unless-stopped
    ports:
      - "${ORDER_PROCESSOR_PORT:-8081}:8081"
    environment:
      SPRING_RABBITMQ_HOST:       rabbitmq
      SPRING_RABBITMQ_USERNAME:   ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD:   ${RABBITMQ_DEFAULT_PASS}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health 2>/dev/null || wget -qO- http://localhost:8081/ 2>/dev/null || exit 0"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 50s
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - rappi_internal_net

  # ── driver_simulator — puerto 8082 (interno) ─────────────────────────
  # Delays configurables sin recompilar via SIMULATOR_DELAY_* env vars.
  driver_simulator:
    build:
      context: .
      dockerfile: infrastructure/docker/driver_simulator.Dockerfile
    container_name: rappi_driver_simulator
    restart: unless-stopped
    ports:
      - "${DRIVER_SIMULATOR_PORT:-8082}:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS:     kafka:9092
      SIMULATOR_DELAY_DELIVERY_STARTED_MS: 5000
      SIMULATOR_DELAY_DRIVER_ARRIVING_MS:  8000
      SIMULATOR_DELAY_ORDER_DELIVERED_MS:  5000
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - rappi_internal_net

  # ── notification_router — puerto 8083 (interno) ──────────────────────
  notification_router:
    build:
      context: .
      dockerfile: infrastructure/docker/notification_router.Dockerfile
    container_name: rappi_notification_router
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_ROUTER_PORT:-8083}:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_RABBITMQ_HOST:           rabbitmq
      SPRING_RABBITMQ_USERNAME:       ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD:       ${RABBITMQ_DEFAULT_PASS}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    depends_on:
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - rappi_internal_net

  # ── sms_worker — réplicas: 2 (Work Queue + balanceo de carga) ────────
  # Con replicas > 1 no puede haber container_name fijo ni port mapping fijo.
  sms_worker:
    build:
      context: .
      dockerfile: infrastructure/docker/sms_worker.Dockerfile
    restart: unless-stopped
    environment:
      SPRING_RABBITMQ_HOST:     rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - rappi_internal_net

  # ── push_notification_worker — réplicas: 2 ───────────────────────────
  push_notification_worker:
    build:
      context: .
      dockerfile: infrastructure/docker/push_notification_worker.Dockerfile
    restart: unless-stopped
    environment:
      SPRING_RABBITMQ_HOST:     rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - rappi_internal_net

  # ── dashboard_aggregator — puerto 8086 (interno) ──────────────────────
  dashboard_aggregator:
    build:
      context: .
      dockerfile: infrastructure/docker/dashboard_aggregator.Dockerfile
    container_name: rappi_dashboard_aggregator
    restart: unless-stopped
    ports:
      - "${DASHBOARD_AGGREGATOR_PORT:-8086}:8086"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL:          jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME:     ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD:     ${POSTGRES_PASSWORD}
      DASHBOARD_BACKEND_URL:          http://dashboard-backend:8087
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      dashboard-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      rappi_internal_net:
        aliases:
          - dashboardaggregator

  # ── dashboard-backend — puerto 8087 (entrada pública) ────────────────
  # Nombre con guión (no guión bajo): Tomcat 10 rechaza '_' en headers Host.
  # Expuesto al host (rappi_public_net) y conectado a la red interna para
  # reachar Postgres, order_api (alias orderapi) y dashboard_aggregator (alias dashboardaggregator).
  dashboard-backend:
    build:
      context: .
      dockerfile: infrastructure/docker/dashboard_backend.Dockerfile
    container_name: rappi_dashboard_backend
    restart: unless-stopped
    ports:
      - "${DASHBOARD_BACKEND_PORT:-8087}:8087"
    environment:
      ORDER_API_URL:  http://orderapi:8080
      AGGREGATOR_URL: http://dashboardaggregator:8086
      SPRING_RABBITMQ_HOST:     rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      rappi_public_net:
      rappi_internal_net:
        aliases:
          - dashboardbackend

# ── Volúmenes ─────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  kafka_data:
    driver: local

# ── Redes segmentadas (driver: bridge) ─────────────────────────────────
#   rappi_public_net   → perímetro de entrada: order_api (8080), dashboard-backend (8087)
#   rappi_internal_net → red de confianza: infraestructura + workers + agregador
#   Los servicios de entrada viven en AMBAS redes para reachar la infraestructura.
networks:
  rappi_public_net:
    driver: bridge
  rappi_internal_net:
    driver: bridge
