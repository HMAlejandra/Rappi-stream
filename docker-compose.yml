# ===================================================
# docker-compose.yml — Rappi-Stream
#
# Fase 8: Límites de recursos, réplicas y healthchecks completos
#
# Uso:
#   cp .env.example .env
#   docker compose up -d
#   docker compose ps
#
# Para escalar workers manualmente (alternativa a replicas):
#   docker compose up -d --scale sms_worker=2 --scale push_notification_worker=2
#
# Verificar límites de recursos:
#   docker stats
# ===================================================

services:

  # =================================================
  # POSTGRESQL 16
  # =================================================
  postgres:
    image: postgres:16.2-alpine
    container_name: rappi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - rappi_net

  # =================================================
  # RABBITMQ 3.13
  # Panel: http://localhost:15672
  # =================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rappi_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - rappi_net

  # =================================================
  # APACHE KAFKA 7.6 — MODO KRAFT (sin ZooKeeper)
  #
  # Sistemas Operativos — cgroups:
  # deploy.resources.limits establece cuotas de CPU y RAM
  # a nivel de cgroup del kernel. Docker aplica estas cuotas
  # al contenedor independientemente de lo que el proceso
  # intente consumir. La JVM respeta estos límites gracias a
  # -XX:+UseContainerSupport.
  #
  # KAFKA_CLUSTER_ID: UUID base64 de 22 caracteres.
  # Generado con: kafka-storage.sh random-uuid
  # Valor fijo en .env para arranques deterministas.
  # =================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: rappi_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
    networks:
      - rappi_net

  # =================================================
  # INIT CONTAINER — CREAR TOPICS KAFKA
  # Se ejecuta una sola vez, crea order_events (3 particiones)
  # =================================================
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: rappi_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"
    networks:
      - rappi_net

  # =================================================
  # MICROSERVICIO 1: order_api
  # Puerto: 8080 | RAM: 384M | CPU: 0.50
  # Entrada HTTP del sistema.
  # =================================================
  order_api:
    build:
      context: .
      dockerfile: order_api/Dockerfile
    container_name: rappi_order_api
    restart: unless-stopped
    ports:
      - "${ORDER_API_PORT:-8080}:8080"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      # JVM ergonómica: respeta los limits de memoria del contenedor
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/orders/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      rappi_net:
        aliases:
          - orderapi

  # =================================================
  # MICROSERVICIO 2: order_processor
  # Puerto: 8081 | RAM: 384M | CPU: 0.50
  # Consume RabbitMQ, publica Kafka, persiste en PG.
  # =================================================
  order_processor:
    build:
      context: .
      dockerfile: order_processor/Dockerfile
    container_name: rappi_order_processor
    restart: unless-stopped
    ports:
      - "${ORDER_PROCESSOR_PORT:-8081}:8081"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health 2>/dev/null || wget -qO- http://localhost:8081/ 2>/dev/null || exit 0"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 50s
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - rappi_net

  # =================================================
  # MICROSERVICIO 3: driver_simulator
  # Puerto: 8082 | RAM: 256M | CPU: 0.25
  # Simula el ciclo de entrega del repartidor.
  # =================================================
  driver_simulator:
    build:
      context: .
      dockerfile: driver_simulator/Dockerfile
    container_name: rappi_driver_simulator
    restart: unless-stopped
    ports:
      - "${DRIVER_SIMULATOR_PORT:-8082}:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Delays de simulación configurables sin recompilar
      SIMULATOR_DELAY_DELIVERY_STARTED_MS: 5000
      SIMULATOR_DELAY_DRIVER_ARRIVING_MS: 8000
      SIMULATOR_DELAY_ORDER_DELIVERED_MS: 5000
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - rappi_net

  # =================================================
  # MICROSERVICIO 4: notification_router
  # Puerto: 8083 | RAM: 256M | CPU: 0.25
  # Puente Kafka → RabbitMQ (Patrón Bridge + Strategy).
  # =================================================
  notification_router:
    build:
      context: .
      dockerfile: notification_router/Dockerfile
    container_name: rappi_notification_router
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_ROUTER_PORT:-8083}:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    depends_on:
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka-init:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - rappi_net

  # =================================================
  # MICROSERVICIO 5: sms_worker
  # RAM: 256M | CPU: 0.25 | RÉPLICAS: 2
  #
  # Sistemas Distribuidos — Escalabilidad horizontal:
  # deploy.replicas: 2 inicia dos instancias del worker.
  # Ambas consumen de client_sms_queue. RabbitMQ distribuye
  # los mensajes en round-robin entre ellas (Work Queue).
  # Esto demuestra balanceo de carga sin coordinación central.
  #
  # IMPORTANTE: con replicas > 1 NO se puede tener
  # container_name fijo ni port mapping fijo (conflicto).
  # Docker Compose asigna nombres y puertos automáticamente.
  # Para ver las instancias: docker compose ps sms_worker
  # =================================================
  sms_worker:
    build:
      context: .
      dockerfile: sms_worker/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - rappi_net

  # =================================================
  # MICROSERVICIO 6: push_notification_worker
  # RAM: 256M | CPU: 0.25 | RÉPLICAS: 2
  #
  # Misma estrategia de escalado que sms_worker.
  # Consume de driver_push_queue con 2 instancias.
  # =================================================
  push_notification_worker:
    build:
      context: .
      dockerfile: push_notification_worker/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - rappi_net

  # =================================================
  # MICROSERVICIO 7: dashboard_aggregator
  # Puerto: 8086 | RAM: 384M | CPU: 0.50
  # Consumidor Stateful Kafka + JPA + notifica al backend.
  # =================================================
  dashboard_aggregator:
    build:
      context: .
      dockerfile: dashboard_aggregator/Dockerfile
    container_name: rappi_dashboard_aggregator
    restart: unless-stopped
    ports:
      - "${DASHBOARD_AGGREGATOR_PORT:-8086}:8086"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      DASHBOARD_BACKEND_URL: http://dashboard_backend:8087
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_started
      dashboard_backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - rappi_net

  # =================================================
  # MICROSERVICIO 8: dashboard_backend
  # Puerto: 8087 | RAM: 384M | CPU: 0.50
  # Servidor WebSocket + sirve dashboard.html.
  # =================================================
  dashboard_backend:
    build:
      context: .
      dockerfile: dashboard_backend/Dockerfile
    container_name: rappi_dashboard_backend
    restart: unless-stopped
    ports:
      - "${DASHBOARD_BACKEND_PORT:-8087}:8087"
    environment:
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - rappi_net

# =====================================================
# VOLUMES — persistencia entre reinicios
# =====================================================
volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  kafka_data:
    driver: local

# =====================================================
# NETWORK — red bridge interna
# Los servicios se comunican por nombre de servicio Docker:
#   kafka:9092 | postgres:5432 | rabbitmq:5672
#   dashboard_backend:8087
# =====================================================
networks:
  rappi_net:
    driver: bridge
